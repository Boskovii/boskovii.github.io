- title: Research Experience
  type: time_table
  contents:
    - title: Research Fellow in Bioengineering
      institution: Harvard Biodesign Lab, Boston, MA
      year: Sep 2026 - Present
      description:
        - Redesigned the control enclosure of a powered ankle exoskeleton to accommodate increased battery capacity and higher motor torque requirements for post-stroke users, supporting extended operation and deployment in home and community environments
        - Improved the durability of the exoskeleton's drivetrain with stronger replacement torque pins, a custom axial retention washer to keep the pins from vibrating out of place, and steel threaded inserts to stop fasteners from loosening during use
        - Developing auditory and vibrotactile biofeedback systems to promote increased paretic trailing limb angle during post-stroke walking, including hardware design and integration into the existing ROS 2 framework
        - Exploring how biofeedback-guided gait training can be combined with human-in-the-loop optimization to improve personalization of exoskeleton assistance and walking outcomes relevant to community ambulation
    - title: Undergraduate Team Lead
      institution: Exoskeleton and Prosthetic Intelligent Controls (EPIC) Lab, Georgia Tech
      year: Aug 2023 - May 2026
      url: /projects/1_project/
      description:
        - Designed and manufactured a novel hip exoskeleton thigh interface with a passive 3-DOF planar mobility mechanism that mitigates skin irritation caused by misalignment between the hip joint and actuator axes
        - Utilized SolidWorks FEA to improve structural design of thigh struts while reducing mass by over 35%
        - Fabricated rapid prototypes using SLS/SLA/FDM 3D printing and manufactured final components using wet-laminated and prepreg carbon-fiber layups
        - Collected kinematic datasets from able-bodied and stroke-impaired participants using VICON across cyclic and non-cyclic locomotor tasks
        - Built multimodal motion-capture datasets (infrared markers, force plates, EMG, IMUs, insole pressure, gait mapping) and automated validation tools in MATLAB to rapidly flag gaps in data and erroneous trials
        - Performed clinical evaluations of stroke participants using the Fugl-Meyer Assessment, enabling correlation of movement data with severity of impairment
        - Coordinated a team of undergraduate researchers by mentoring new members, supporting development of teammates' technical and research skills, and facilitating communication with lab faculty
    - title: Undergraduate Researcher
      institution: Physiology of Wearable Robotics (PoWeR) Lab, Georgia Tech
      year: Aug 2024 - May 2025
      url: /projects/2_project/
      description:
        - Identified and corrected design flaws in an open-source ankle work-loop observation platform, increasing structural rigidity to better secure the force plate and isolate soleus muscle activity
        - Designed a custom motor-driven dynamometer rig in Fusion 360 to replace a weight stack and enable testing under variable-speed and complex loading conditions
        - Selected motor and gearbox components capable of safely exceeding human plantar-flexion torque across all speeds by generating torque-speed curves in MATLAB, thereby enabling isokinetic testing
        - Fabricated aluminum brackets and structural bars using a waterjet and drill press; designed a reinforced motor mount for assembly via welding to reduce frame bending and inertial effects; machined steel hard-stop bars to prevent ankle overextension

- title: Relevant Course Projects
  type: time_table
  contents:
    - title: Dynamic Simulation of Hip-Knee Joint Mechanics
      institution: "ME3017: System Dynamics"
      year: Jan 2025 - May 2025
      url: /projects/3_project/
      description:
        - Developed a double-pendulum model of the human hip and knee using torsional springs and dampers at each joint to model ligamentous stiffness, muscle damping, and gravitational effects on the thigh and shank
        - Used anthropometric data from biomechanics literature to derive differential equations of motion and linearized them about equilibrium to analyze stability, frequency response, and transient behavior
        - Simulated input torques representing a martial-arts kick, a soccer strike, and rehabilitative cycling, and compared nonlinear and linearized system responses using MATLAB
    - title: Design and Control of an Autonomous Robot
      institution: "ME2110: Creative Decisions and Design"
      year: Jan 2024 - May 2024
      url: /projects/4_project/
      description:
        - Programmed an autonomous robot's control system in Arduino, integrating IR/ultrasonic sensing with motor, solenoid, and pneumatic actuation to execute competition tasks
        - Designed a low-profile scissor lift extending 4.5 feet from a collapsed height of 4 inches and machined a custom aluminum spool on a lathe to drive the lift cable
        - Built a rapid-deploy obstacle-clearing mechanism using drawer slides and pneumatic actuation

